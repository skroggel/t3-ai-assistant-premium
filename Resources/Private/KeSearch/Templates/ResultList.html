<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:kesearch="http://typo3.org/ns/Tpwd/KeSearch/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:layout name="General" />

<f:comment><!--
    =====================
    Templates/ResultList.html

    Settings are available via
    {conf}
    {extConf}
    {extConfPremium}
    --></f:comment>

<f:section name="content">
    <f:asset.script
        identifier="ai-assistant-premium-vue"
        src="EXT:ai_assistant_premium/Resources/Public/JavaScript/ai-assistant-premium.js"
    />

    <f:if condition="{wordsTooShort}">
        <div class="messsage">{f:translate(key: 'LLL:EXT:ke_search/Resources/Private/Language/locallang_searchbox.xlf:searchword_length_error', arguments: {0: extConf.searchWordLength})}</div>
    </f:if>

    <f:if condition="{resultListAdditionalRawContent}">
        <f:format.raw>{resultListAdditionalRawContent}</f:format.raw>
    </f:if>

    <ai-assistant-search-payload-builder
        rows-json="{resultrows -> f:format.json() -> f:format.htmlspecialchars()}"
        id-field="orig_uid"
        title-field="title_text"
        text-field="content_text"
        url-field="url"
        type-field="type"
        page-id-field="orig_pid"
        changed-at-field="date_timestamp"
    ></ai-assistant-search-payload-builder>

    <f:if condition="{isEmptySearch}">
        <f:then>
            <f:if condition="{conf.showTextInsteadOfResults}">
                <f:then>
                    <f:format.raw>{conf.textForResults}</f:format.raw>
                </f:then>
                <f:else>
                    <f:render partial="ResultRows" arguments="{
                        conf: conf,
                        numberofresults: numberofresults,
                        resultrows: resultrows,
                        sortingLinks: sortingLinks,
                        pagination:pagination,
                        queryTime:queryTime,
                        queryTimeText:queryTimeText
                        }" />
                </f:else>
            </f:if>
        </f:then>
        <f:else>
            <f:if condition="{numberofresults} == 0">
                <f:then>
                    <f:render partial="NoResults" arguments="{conf: conf, noResultsText: noResultsText}" />
                </f:then>
                <f:else>
                    <f:render partial="ResultRows" arguments="{
                            conf: conf,
                            numberofresults: numberofresults,
                            resultrows: resultrows,
                            sortingLinks: sortingLinks,
                            pagination:pagination,
                            queryTime:queryTime,
                            queryTimeText:queryTimeText
                            }" />
                </f:else>
            </f:if>
        </f:else>
    </f:if>
    <f:if condition="errors">
        <f:for each="{errors}" as="error">
            <div class="ke_search-error">{error}</div>
        </f:for>
    </f:if>
</f:section>
