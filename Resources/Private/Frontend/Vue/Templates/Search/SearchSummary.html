<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

    <f:asset.script
        identifier="ai-assistant-transport"
        src="EXT:ai_assistant/Resources/Public/JavaScript/ai-assistant-transport.js"
    />

    <f:asset.script
        identifier="ai-assistant-chat-vue"
        src="EXT:ai_assistant/Resources/Public/JavaScript/ai-assistant-chat.js"
    />

    <f:asset.script
        identifier="ai-assistant-premium-vue"
        src="EXT:ai_assistant_premium/Resources/Public/JavaScript/ai-assistant-premium.js"
    />

    <f:if condition="{settings.includeDefaultStyles}">
        <f:asset.css identifier="ai-assistant-chat-css" href="EXT:ai_assistant/Resources/Public/Css/t3-ai-assistant-frontend.css" />
    </f:if>

    <ai-assistant-search-summary
        sse-endpoint="{f:uri.action(action: 'stream', controller: 'Chat', extensionName: 'AiAssistant', pluginName: 'Chat', pageType: '1790831370', arguments: '{id: pageUid}')}"
        json-endpoint="{f:uri.action(action: 'assistant', controller: 'Json', extensionName: 'AiAssistant', pluginName: 'Chat', pageType: '1790831371', arguments: '{id: pageUid}')}"

        query="{searchString -> f:format.htmlspecialchars()}"
        assistant-profile="{settings.assistantProfile}"
        chat-identifier="{chatIdentifier}"
        request-token="{requestToken}"
        integration="{integration}"
        start-timestamp="{startTimestamp}"

        settings-json="{settingsJson -> f:format.htmlspecialchars()}"
        chat-options-json="{chatOptionsJson -> f:format.htmlspecialchars()}"
        labels-json="{labelsJson -> f:format.htmlspecialchars()}"
        ui-components-json="{uiComponentsJson -> f:format.htmlspecialchars()}"

        error-handling="{errorHandling}"
        stream-response="{settings.streamResponse}"
        show-without-results="{settings.showWithoutResults}"
    ></ai-assistant-search-summary>
</html>
