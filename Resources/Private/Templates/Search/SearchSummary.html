<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

    <f:asset.css
        identifier="ai-assistant-frontend"
        href="EXT:ai_assistant/Resources/Public/Styles/Frontend.css"
    />

    <f:asset.script
            identifier="ai-assistant-marked"
            src="EXT:ai_assistant/Resources/Public/Libs/marked-18.0.5.umd.js"
    />

    <f:asset.script
            identifier="ai-assistant-purify"
            src="EXT:ai_assistant/Resources/Public/Libs/purify-3.4.10.min.js"
    />

    <f:asset.script
            identifier="ai-assistant-transport"
            src="EXT:ai_assistant/Resources/Public/JavaScript/AiAssistantTransport.js"
    />

    <f:asset.script
            identifier="ai-assistant-chat"
            src="EXT:ai_assistant/Resources/Public/JavaScript/AiAssistantChatBox.js"
    />

    <f:asset.script
            identifier="ai-assistant-premium-search"
            src="EXT:ai_assistant_premium/Resources/Public/JavaScript/AiAssistantSearch.js"
    />

    <f:asset.script
        identifier="ai-assistant-premium-frontend"
        src="EXT:ai_assistant_premium/Resources/Public/JavaScript/Frontend.js"
    />

    <section class="chat-box">
        <f:render partial="Search/SummaryForm" arguments="{_all}" />
    </section>
</html>
