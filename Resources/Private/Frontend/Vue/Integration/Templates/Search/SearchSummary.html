<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

    <!--
        The Integration template leaves Summary rendering to the site Vue
        application. That application can inject the same custom chat component
        used by the standalone Chat content element.
    -->
    <f:asset.script
        identifier="ai-assistant-transport"
        src="EXT:ai_assistant/Resources/Public/JavaScript/ai-assistant-transport.js"
    />

    <f:if condition="{settings.includeDefaultStyles}">
        <f:asset.css identifier="ai-assistant-chat-css" href="EXT:ai_assistant/Resources/Public/Css/t3-ai-assistant-frontend.css" />
    </f:if>

    <div
        id="{settings.elementId}"
        data-ai-assistant-summary-mount="1"
        data-sse-endpoint="{f:uri.action(action: 'stream', controller: 'Chat', extensionName: 'AiAssistant', pluginName: 'Chat', pageType: '1790831370', arguments: '{id: pageUid}')}"
        data-json-endpoint="{f:uri.action(action: 'assistant', controller: 'Json', extensionName: 'AiAssistant', pluginName: 'Chat', pageType: '1790831371', arguments: '{id: pageUid}')}"
        data-query="{searchString -> f:format.htmlspecialchars()}"
        data-assistant-profile="{settings.assistantProfile}"
        data-chat-identifier="{chatIdentifier}"
        data-request-token="{requestToken}"
        data-integration="{integration}"
        data-start-timestamp="{startTimestamp}"
        data-settings-json="{settingsJson -> f:format.htmlspecialchars()}"
        data-chat-options-json="{chatOptionsJson -> f:format.htmlspecialchars()}"
        data-labels-json="{labelsJson -> f:format.htmlspecialchars()}"
        data-ui-components-json="{uiComponentsJson -> f:format.htmlspecialchars()}"
        data-error-handling="{errorHandling}"
        data-stream-response="{settings.streamResponse}"
        data-show-without-results="{settings.showWithoutResults}"
    ></div>
</html>
